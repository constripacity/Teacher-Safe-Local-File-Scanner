[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teacher-safe-local-file-scanner"
version = "0.3.0"
description = "Offline batch triage for student file submissions: tells a teacher which files not to open, and why"
authors = [{ name = "Teacher-Safe Maintainers" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["security", "education", "scanner", "defensive", "offline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
# The desktop window uses tkinter from the standard library — no extra needed.
# (Debian/Ubuntu package it separately: sudo apt install python3-tk)
xml = ["defusedxml>=0.7"]
yara = ["yara-python>=4.5"]
build = ["pyinstaller>=6.5"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "defusedxml>=0.7", "pre-commit>=3.7"]

[project.urls]
Homepage = "https://github.com/constripacity/Teacher-Safe-Local-File-Scanner"
Source = "https://github.com/constripacity/Teacher-Safe-Local-File-Scanner"
Issues = "https://github.com/constripacity/Teacher-Safe-Local-File-Scanner/issues"

[project.scripts]
teacher-safe-scan = "scanner.main:main"

[project.gui-scripts]
teacher-safe-scan-gui = "scanner.gui:run"

[tool.setuptools.packages.find]
where = ["."]
# `examples` is included deliberately: `teacher-safe-scan make-samples` imports
# `examples.generate_benign_samples`, so an installed copy that omitted it would
# ship a command that raises ImportError.
include = ["scanner*", "examples*"]
exclude = ["examples.benign_samples*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
# yara-python is an optional extra that may not be installed, and defusedxml is
# optional too (the XML detectors fall back to a non-expanding parser without
# it). `magic` used to be listed here for a `python-magic` extra that nothing
# imported: `scanner.detectors.base.sniff_magic` reads the header bytes itself,
# so the dependency bought nothing and the extra has been removed.
[[tool.mypy.overrides]]
module = ["yara", "defusedxml.*"]
ignore_missing_imports = true
